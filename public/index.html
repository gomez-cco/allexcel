<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALLEXCEL — asistente de fórmulas de Excel</title>
<meta name="description" content="ALLEXCEL: consulta qué fórmulas de Excel usar y cómo combinarlas, con pasos para exportar a CSV, Power BI o tu ERP.">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e6b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ALLEXCEL">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <button class="icon-btn" id="menuToggle" aria-label="Abrir menú de temas" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <div class="brand">
      <span class="brand-mark" aria-hidden="true">Ax</span>
      <div class="brand-text">
        <span class="brand-title">ALLEXCEL</span>
        <span class="brand-sub">by JJ</span>
      </div>
    </div>

    <div class="topbar-controls" role="group" aria-label="Tamaño de letra">
      <button class="icon-btn" id="newChatBtn" aria-label="Nueva consulta" title="Nueva consulta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.66-5.66M20 12a8 8 0 0 1-13.66 5.66M17 4v4h-4M7 20v-4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>
      <button class="icon-btn" id="fontDown" aria-label="Reducir tamaño de letra">A−</button>
      <button class="icon-btn" id="fontUp" aria-label="Aumentar tamaño de letra">A+</button>
      <button class="icon-btn" id="themeToggle" aria-label="Cambiar tema claro u oscuro">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Temas disponibles">
      <div class="sidebar-section">
        <h2>Cómo llevar tus datos más allá</h2>
        <ul id="guideList" class="topic-list"></ul>
      </div>
      <div class="sidebar-section">
        <h2>Categorías de fórmulas</h2>
        <ul id="categoryList" class="topic-list"></ul>
      </div>
      <p class="sidebar-note">Base de fórmulas cargada desde el manual propio. Power Query y macros se explican con guía general, ya que no vienen en el manual.</p>
    </nav>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="chat" aria-live="polite">
      <div class="messages" id="messages"></div>

      <form class="composer" id="composerForm">
        <label for="composerInput" class="sr-only">Escribe tu consulta sobre Excel</label>
        <textarea id="composerInput" rows="1" placeholder="Ej: quiero sumar las ventas solo de la sucursal norte..." autocomplete="off"></textarea>
        <button type="submit" class="send-btn" aria-label="Enviar consulta">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 8 6 8-16-8z" fill="currentColor"/></svg>
        </button>
      </form>
    </main>
  </div>
</div>

<template id="tpl-function-card">
  <article class="card card-function">
    <header class="card-header">
      <span class="pill" data-role="categoria"></span>
      <h3><span data-role="name"></span> <span class="alias" data-role="alias"></span></h3>
    </header>
    <p class="card-text" data-role="quehace"></p>
    <div class="code-block" data-role="sintaxis"></div>
    <details class="card-details" data-role="argsWrap">
      <summary>Argumentos</summary>
      <ul data-role="args"></ul>
    </details>
    <details class="card-details" data-role="ejemploWrap">
      <summary>Ejemplo paso a paso</summary>
      <ul data-role="ejemplo" class="example-list"></ul>
    </details>
    <p class="card-tip" data-role="consejoWrap"><strong>Tip:</strong> <span data-role="consejo"></span></p>
    <p class="card-variations" data-role="variacionesWrap"><strong>También puedes:</strong> <span data-role="variaciones"></span></p>
  </article>
</template>

<template id="tpl-guide-card">
  <article class="card card-guide">
    <header class="card-header">
      <span class="pill pill-guide">Proceso</span>
      <h3 data-role="titulo"></h3>
    </header>
    <p class="card-text" data-role="resumen"></p>
    <ol class="steps" data-role="pasos"></ol>
    <p class="card-tip" data-role="consejoWrap"><strong>Tip:</strong> <span data-role="consejo"></span></p>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
